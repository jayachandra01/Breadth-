<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning tool, calm and exact, like a good course reader
   IDEA an architect's monograph: one big index card per topic, ruled notes, concrete planes
   PICTURE today's topic card, large, with its resource stack; coverage bars across 8 pillars beside it
   COLOUR white, black ink, concrete #d8d8d4 planes, safety yellow on the one primary action; night #1a1a19
   TYPE Hanken Grotesk 800 for titles, Hanken Grotesk 400/500 for text
   LAYOUT laptop: card 2/3 left, side column right; phone: title, card, side stacked */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#1a1a19);--ink:light-dark(#111111,#ededea);--mute:light-dark(#5c5c58,#a9a9a3);--plane:light-dark(#d8d8d4,#2b2b29);--soft:light-dark(#f1f1ee,#232321);--line:light-dark(#c9c9c4,#3a3a37);--yel:#ffe600;--yelink:#111;--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-inline:max(4vw,16px)}
.top{background:var(--ink);color:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:12px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-right:auto}
.brand span{display:inline-block;width:12px;height:12px;background:var(--yel);margin-left:4px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--bg);opacity:.72;padding:10px 12px;min-height:44px;cursor:pointer;font-weight:600;border-radius:6px}
nav button[aria-current=true]{opacity:1;background:color-mix(in srgb,var(--bg) 14%,transparent)}
nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
main{padding-block:clamp(20px,3vw,40px)}
h1{font-size:clamp(32px,4.4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:6px 0 12px;font-weight:800;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
.mute{color:var(--mute)}
.small{font-size:14px}
.today{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;align-items:start}
.card{border:1px solid var(--line);border-radius:10px;padding:clamp(18px,3vw,32px);background:var(--bg)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute)}
.tag{background:var(--ink);color:var(--bg);padding:3px 9px;border-radius:4px;font-weight:600;font-size:13px;white-space:nowrap}
.tag.y{background:var(--yel);color:var(--yelink)}
.hook{font-size:19px;font-weight:500;margin:0 0 14px}
.note{background:var(--soft);border-left:4px solid var(--ink);padding:10px 14px;margin:12px 0;border-radius:0 6px 6px 0}
.trail{font-size:14px;color:var(--mute);margin-top:8px}
.trail button{background:none;border:0;padding:0;text-decoration:underline;cursor:pointer;color:inherit;font-size:14px}
.res{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.res li{display:grid;grid-template-columns:9.5em minmax(0,1fr) auto;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.res .lab{font-size:13px;font-weight:700}
.res .t{font-weight:600}
.res .by{font-size:14px;color:var(--mute)}
.res a.go{font-size:14px;font-weight:600;white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:6px;text-decoration:none}
.res a.go:hover{background:var(--soft)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{min-height:44px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--yel);color:var(--yelink);border-color:var(--yel)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5;cursor:default}
.side{display:grid;gap:16px}
.panel{background:var(--soft);border-radius:10px;padding:18px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:7.5em minmax(0,1fr) 2em;gap:8px;align-items:center;font-size:14px}
.track{height:10px;background:var(--plane);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--ink)}
.bar.off{opacity:.4}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.due{font-size:12px;font-weight:700;background:var(--yel);color:var(--yelink);padding:1px 6px;border-radius:3px;margin-left:4px}
.mini{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mini button{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.mini button[aria-current=true]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.mini b{display:block;font-size:15px}
.mini span{font-size:13px;color:var(--mute)}
.banner{background:var(--soft);border:1px solid var(--line);padding:12px 14px;border-radius:8px;margin-bottom:16px}
   .linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.banner.err{border-color:var(--bad);color:var(--bad)}
.form{max-width:760px;display:grid;gap:22px}
.field{display:grid;gap:6px}
.field label,.lbl{font-weight:700}
input[type=text],input[type=password],input[type=email],input[type=time],input[type=number],input[type=search],textarea,select{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:44px;width:100%}
textarea{min-height:90px;resize:vertical}
.ptable{display:grid;gap:0;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:minmax(0,1.3fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .pn{font-weight:600}
.prow .pe{font-size:13px;color:var(--mute);font-weight:400}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:8px 10px;min-height:40px;cursor:pointer;font-size:14px;font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.chk{display:inline-flex;gap:6px;align-items:center;min-height:44px;padding-right:8px}
.chk input{width:20px;height:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:12px}
.lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22em),1fr));gap:16px;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px}
.stat{background:var(--soft);border-radius:8px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.wk li{grid-template-columns:7.5em minmax(0,1fr) auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.modal{position:fixed;inset:0;background:color-mix(in srgb,#000 50%,transparent);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:420px}
footer{padding-block:24px;font-size:13px;color:var(--mute)}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.res li{grid-template-columns:minmax(0,1fr) auto}.res .lab{grid-column:1/-1}.prow{grid-template-columns:minmax(0,1fr)}nav button{padding:10px 8px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">Breadth<span></span></div><nav id="nav"></nav></div></header>
<main class="wrap" id="app"><p class="mute"><span class="spin"></span>Loading…</p></main>
<footer class="wrap">New drops arrive when you open Breadth. Your topics and key stay in this browser. Resource links open the source, or a search for that exact title and author. Version 7.</footer>
<script>
{
const PILLARS=[
{id:'strategy',name:'Strategy & business models',short:'Strategy',ex:'Moats, platforms, unit economics'},
{id:'finance',name:'Finance & accounting',short:'Finance',ex:'P&L, cash flow, valuation'},
{id:'econ',name:'Economics & markets',short:'Economics',ex:'Rates, inflation, IPOs'},
{id:'tech',name:'Technology & AI',short:'Tech & AI',ex:'LLMs, cloud, build vs buy'},
{id:'growth',name:'Marketing, sales & growth',short:'Growth',ex:'Positioning, funnels, pricing'},
{id:'ops',name:'Operations & product',short:'Ops & product',ex:'OKRs, PMF, prioritisation'},
{id:'comms',name:'Communication & influence',short:'Communication',ex:'Pyramid principle, negotiation'},
{id:'lead',name:'Leadership & personal effectiveness',short:'Leadership',ex:'Managing up, feedback, decisions'}];
const W={off:0,light:1,normal:2,focus:3};
const FOCUS_DEF=['strategy','finance','lead'];
const LENS=`AUDIENCE LENS: Breadth is built for ambitious people heading toward the top of a company: future CEOs and general managers, founders, and MBA aspirants or students.
- Topics: frame each one from the seat of the person accountable for the whole business. Favour what leaders actually decide and get judged on: capital allocation, strategy trade-offs, unit economics, fundraising and cap tables, pricing, org design and hiring, board and investor communication, negotiation, decision-making under uncertainty, and the core MBA curriculum taught through the case method. Avoid entry-level trivia and narrow functional how-tos.
- "take" should sound like how a strong CEO, founder or investor would think about it.
- Resources, in order of preference: HBS cases and HBR classics; shareholder and founder letters (e.g. Buffett, Bezos); operator books (e.g. High Output Management, The Outsiders, The Hard Thing About Hard Things, 7 Powers); YC and Paul Graham essays; McKinsey Quarterly; Stratechery; long-form operator podcasts (e.g. Acquired, Invest Like the Best); open courses from top business schools (MIT OpenCourseWare, Wharton or HBS Online). Use these only where they genuinely fit the topic.`;
const LV={new:'new to it: explain from first principles, no jargon',some:'knows the basics: skip definitions, add mechanisms and examples',strong:'strong: go to nuance, numbers, live debates and trade-offs'};
const FORMATS=['article','book','video','podcast','course'];
const pById=id=>PILLARS.find(p=>p.id===id)||PILLARS[0];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayKey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const weekKey=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+Math.ceil(((t-y)/864e5+1)/7)};
const fmtT=ts=>{const d=new Date(ts),n=new Date();const t=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return dayKey(d)===dayKey(n)?'Today '+t:d.toLocaleDateString([],{month:'short',day:'numeric'})+', '+t};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

const defProfile=()=>({goal:'',role:'',resume:'',pillars:Object.fromEntries(PILLARS.map(p=>[p.id,{w:FOCUS_DEF.includes(p.id)?'focus':'normal',lvl:'some'}])),perDay:1,times:['08:00','13:00','19:00'],hStart:8,hEnd:20,formats:{article:true,book:true,video:true,podcast:true,course:false}});
const SAMPLE={id:'sample',sample:true,ts:Date.now(),pillar:'finance',title:'Why cash flow beats profit',hook:'How can a profitable company run out of money?',what:'Profit is an accounting result: revenue minus expenses, recognised when earned, not when paid. Cash flow is the money actually moving in and out. A fast-growing firm can book big profits while its cash sits in unpaid invoices and inventory, which is why many profitable companies still go bust.',why:'In any budget, pricing or growth conversation, asking "what does this do to cash?" marks you as someone who understands how the business really runs.',take:'Revenue is vanity, profit is sanity, cash is reality.',connection:'',resources:[{label:'Start here',type:'article',title:'Cash flow',creator:'Wikipedia',minutes:6,url:'https://en.wikipedia.org/wiki/Cash_flow',searchQuery:'Cash flow'},{label:'Best single read',type:'book',title:'Financial Intelligence (chapters on cash)',creator:'Karen Berman & Joe Knight',minutes:30,url:'',searchQuery:'Financial Intelligence Karen Berman Joe Knight'},{label:'Go deep',type:'book',title:'The Personal MBA',creator:'Josh Kaufman',minutes:300,url:'',searchQuery:'The Personal MBA Josh Kaufman'},{label:'Another angle',type:'essay',title:'Berkshire Hathaway shareholder letters on owner earnings',creator:'Warren Buffett',minutes:20,url:'',searchQuery:'Buffett owner earnings shareholder letter 1986'}],next:['Working capital and the cash conversion cycle','EBITDA and why critics distrust it'],saved:false,fb:null};

let S={v:1,profile:null,drops:[],weekly:{},stock:[],skipped:{},m:{res:0}};
let view='today',cur=null,busy=false,busyMsg='',err='',info='',confirmReset=false,draft=null,libQ='';
let KEY='',MODEL='',ready=false;const failed=new Set();let cands=[];const hasAI=()=>!!KEY;

/* ---------- persistence ---------- */
let writing=false,again=false;
function trim(){const keep=S.drops.filter(d=>d.saved);const rest=S.drops.filter(d=>!d.saved).slice(-160);S.drops=[...keep,...rest].sort((a,b)=>a.ts-b.ts)}
function save(){trim();try{localStorage.setItem('breadth.v1',JSON.stringify(S))}catch(e){err='Your browser blocked saving. Use Profile, Back up to keep a copy.'}}
function migrate(P){if(!P.times){const t=P.time||'08:00';P.times=[t,'13:00','19:00'];P.perDay=P.cadence==='hourly'?'hourly':1}if(![1,2,3,'hourly'].includes(P.perDay))P.perDay=1;if(!(P.hStart>=0&&P.hStart<=23))P.hStart=8;if(!(P.hEnd>P.hStart&&P.hEnd<=24))P.hEnd=Math.min(24,Math.max(P.hStart+1,20));delete P.cadence;delete P.maxPerDay;delete P.time;return P}
function setKey(k){KEY=(k||'').trim();try{KEY?localStorage.setItem('breadth.key',KEY):localStorage.removeItem('breadth.key')}catch(e){}}
function setModel(m){MODEL=m||'';try{MODEL?localStorage.setItem('breadth.model',MODEL):localStorage.removeItem('breadth.model')}catch(e){}}
async function load(){try{const raw=localStorage.getItem('breadth.v1');if(raw)S=Object.assign(S,JSON.parse(raw));KEY=localStorage.getItem('breadth.key')||'';MODEL=localStorage.getItem('breadth.model')||'';if(localStorage.getItem('breadth.modelv')!=='2'){MODEL='';localStorage.removeItem('breadth.model');localStorage.setItem('breadth.modelv','2')}}catch(e){info='This browser is not letting Breadth save data, so nothing will be remembered after you close it.'}if(S.profile)S.profile=migrate(S.profile);if(!Array.isArray(S.stock))S.stock=[];if(S.packs){for(const k of Object.keys(S.packs))S.stock.push(...(S.packs[k].topics||[]));delete S.packs}if(!S.skipped)S.skipped={};ready=true}

/* ---------- scheduling ---------- */
function slots(P){if(P.perDay==='hourly'){const out=[];for(let h=P.hStart;h<P.hEnd;h++)out.push(String(h).padStart(2,'0')+':00');return out}return P.times.slice(0,P.perDay).filter(t=>/^\d\d:\d\d$/.test(t)).sort()}
function at(t,base){const [h,m]=t.split(':').map(Number);const d=base?new Date(base):new Date();d.setHours(h,m,0,0);return d}
const fmtClock=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function todaysScheduled(){const k=dayKey(new Date());return S.drops.filter(d=>d.scheduled&&dayKey(new Date(d.ts))===k).length}
const BATCH=5,CATCHUP=3;
function leftover(){return (S.stock||[]).length}
function skippedToday(){return (S.skipped||{})[dayKey(new Date())]||0}
function dueCount(){const P=S.profile;if(!P)return 0;const now=new Date();const passed=slots(P).filter(t=>at(t)<=now).length;return Math.max(0,passed-todaysScheduled()-skippedToday())}
function nextText(){const P=S.profile;if(!P)return '';const due=dueCount();if(due>0)return due===1?'A drop is ready':due+' drops are ready';
  const now=new Date();const done=todaysScheduled()+skippedToday();const sl=slots(P);const nxt=sl.slice(done).map(t=>at(t)).find(d=>d>now);
  if(nxt&&done<sl.length)return 'Next drop today at '+fmtClock(nxt);return 'Next drop tomorrow at '+fmtClock(at(sl[0]||'08:00'))}
function coverage(days){const since=Date.now()-days*864e5;const c=Object.fromEntries(PILLARS.map(p=>[p.id,0]));S.drops.forEach(d=>{if(!d.sample&&d.ts>=since&&c[d.pillar]!=null)c[d.pillar]++});return c}
function lastSeen(id){const ds=S.drops.filter(d=>d.pillar===id&&!d.sample);return ds.length?ds[ds.length-1].ts:0}
function pickPillar(){const P=S.profile;const act=PILLARS.filter(p=>W[P.pillars[p.id].w]>0);if(!act.length)return PILLARS[0].id;
  const overdue=act.filter(p=>Date.now()-lastSeen(p.id)>14*864e5);const recent=S.drops.slice(-2).map(d=>d.pillar);
  const pool=overdue.filter(p=>!recent.includes(p.id));if(pool.length&&Math.random()<.6)return pool[Math.floor(Math.random()*pool.length)].id;
  let best=null,bs=-1;act.forEach(p=>{const days=(Date.now()-(lastSeen(p.id)||Date.now()-30*864e5))/864e5;let s=W[P.pillars[p.id].w]*(1+Math.min(days,21)/7)*(.6+Math.random()*.8);if(recent[recent.length-1]===p.id)s*=.2;if(s>bs){bs=s;best=p.id}});return best}

/* ---------- generation ---------- */
function linkFor(r){if(r.url&&/^https:\/\/en\.wikipedia\.org\/wiki\//.test(r.url))return {href:r.url,direct:true};const q=encodeURIComponent(r.searchQuery||(r.title+' '+(r.creator||'')));return {href:(r.type==='video'?'https://www.youtube.com/results?search_query=':'https://www.google.com/search?q=')+q,direct:false}}
const GAPI='https://generativelanguage.googleapis.com/v1beta';
let busyDetail='',busyStart=0;const TIMEOUT=window.BREADTH_TIMEOUT||75000;
function status(t){busyDetail=t;const el=document.getElementById('bstat');if(el)el.textContent=t}
async function tfetch(u,o){const c=new AbortController();const t=setTimeout(()=>c.abort(),TIMEOUT);try{return await fetch(u,Object.assign({},o,{signal:c.signal}))}catch(e){throw {code:e&&e.name==='AbortError'?'timeout':'offline'}}finally{clearTimeout(t)}}
async function listModels(){status('Finding a free Gemini model for your key…');const r=await tfetch(GAPI+'/models?pageSize=200',{headers:{'x-goog-api-key':KEY}});if(!r.ok)throw await apiErr(r);const j=await r.json();
  const bad=/(image|tts|audio|live|embed|vision|thinking-exp|learnlm|gemma|aqa|veo|imagen|robotics|computer)/i;
  const ids=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>String(m.name).replace(/^models\//,'')).filter(id=>id.startsWith('gemini')&&!bad.test(id)&&!failed.has(id)&&!isExhausted(id));
  const score=id=>(/flash-lite/.test(id)?200:/flash/.test(id)?100:0)-(/(preview|exp)/.test(id)?50:0)+(parseFloat((id.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1])||0);
  return ids.sort((a,b)=>score(b)-score(a))}
function exMap(){try{return JSON.parse(localStorage.getItem('breadth.exhausted')||'{}')}catch(e){return {}}}
function isExhausted(id){const t=exMap()[id];return t&&Date.now()-t<20*36e5}
function markExhausted(id){const m=exMap();m[id]=Date.now();try{localStorage.setItem('breadth.exhausted',JSON.stringify(m))}catch(e){}}
async function apiErr(r){const t=await r.text().catch(()=>'');let detail='';try{detail=(JSON.parse(t).error||{}).message||''}catch(_){detail=t.slice(0,200)}if(/API_KEY_INVALID|API key not valid|API key expired/i.test(t))return {code:'badkey',detail};if(r.status===429)return {code:429,zero:/limit: ?0\b/.test(t),daily:/per ?day|PerDay|RequestsPerDay/i.test(t),detail};return {code:r.status,detail:detail||('HTTP '+r.status)}}
function parseLoose(text,mode){if(!text)return null;let t=text.replace(/```(?:json)?/gi,'').trim();
  const tryP=x=>{try{return JSON.parse(x)}catch(e){return undefined}};
  let v=tryP(t);if(v===undefined){const a=t.search(/[\[{]/);const b=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));if(a>=0&&b>a)v=tryP(t.slice(a,b+1))}
  if(v===undefined||v===null)return null;if(mode==='list'){if(Array.isArray(v))return {items:v};if(v&&Array.isArray(v.items))return v;if(v&&v.title)return {items:[v]};if(v&&typeof v==='object'){const arr=Object.values(v).find(Array.isArray);if(arr)return {items:arr}}return null}if(Array.isArray(v))v=v.length===1||!v[0]||!v[0].type?v[0]:{items:v};
  if(v&&typeof v==='object'&&!v.title&&!v.items){const ks=Object.keys(v);if(ks.length===1&&v[ks[0]]&&typeof v[ks[0]]==='object')v=Array.isArray(v[ks[0]])?(v[ks[0]][0]&&v[ks[0]][0].title&&!v[ks[0]][0].type?v[ks[0]][0]:{items:v[ks[0]]}):v[ks[0]]}
  if(v&&typeof v==='object'){if(!v.title&&(v.topic||v.name))v.title=v.topic||v.name;if(!v.resources&&Array.isArray(v.resource))v.resources=v.resource}
  return v&&typeof v==='object'?v:null}
async function ask(prompt,mode){if(!KEY)throw {code:'nokey'};let lastErr=null,waited=false,parseFails=0,serverFails=0;

  <div><div class="lbl">Your pillars</div><p class="small mute" style="margin:2px 0 8px">How much of each you want, and where you are today. Focus pillars come up about three times as often as light ones.</p><div class="ptable">${PILLARS.map(p=>`<div class="prow"><div class="pn">${esc(p.name)}<div class="pe">${esc(p.ex)}</div></div>${seg('w',[['off','Off'],['light','Light'],['normal','Normal'],['focus','Focus']],P.pillars[p.id].w,p.id)}${seg('lvl',[['new','New'],['some','Some'],['strong','Strong']],P.pillars[p.id].lvl,p.id)}</div>`).join('')}</div></div>
  <div><div class="lbl">How often</div><p class="small mute" style="margin:2px 0 8px">Breadth keeps a stock of ready topics and fetches 5 at a time in one request, so even hourly drops use only a few requests a day.</p><div class="row">${seg('perDay',[['1','Once a day'],['2','Twice'],['3','3 times'],['hourly','Hourly']],String(P.perDay))}</div>
  <div class="grid2" style="margin-top:10px;max-width:560px">${P.perDay==='hourly'?`<div class="field"><label for="hs">From (hour, 0 to 23)</label><input type="number" id="hs" min="0" max="23" value="${P.hStart}"></div><div class="field"><label for="he">Until (hour, 1 to 24)</label><input type="number" id="he" min="1" max="24" value="${P.hEnd}"></div>`:''}${[0,1,2].slice(0,P.perDay==='hourly'?0:P.perDay).map(i=>`<div class="field"><label for="t${i}">${['First','Second','Third'][i]} drop</label><input type="time" id="t${i}" value="${esc(P.times[i])}"></div>`).join('')}</div></div>
  <div><div class="lbl">Formats you like</div><div class="row">${FORMATS.map(f=>`<label class="chk"><input type="checkbox" data-fmt="${f}" ${P.formats[f]?'checked':''}>${f[0].toUpperCase()+f.slice(1)+'s'}</label>`).join('')}</div></div>
  <div class="actions"><button class="btn pri" type="submit">${isNew?'Start my first drop':'Save changes'}</button></div></form>`}
function profileView(){const all=S.drops.filter(d=>!d.sample);const st=[['Topics received',all.length],['Saved',all.filter(d=>d.saved).length],['Resources opened',S.m.res||0],['More like this',all.filter(d=>d.fb==='more').length],['Less like this',all.filter(d=>d.fb==='less').length],['Already knew',all.filter(d=>d.fb==='know').length]];
  return `${info?`<div class="banner">${esc(info)}</div>`:''}${err?`<div class="banner err">${esc(err)}</div>`:''}${profileForm(false)}<h2 style="margin-top:40px">Your numbers</h2><div class="stats" style="max-width:760px">${st.map(([l,v])=>`<div class="stat"><b>${v}</b>${l}</div>`).join('')}</div>
  <h2 style="margin-top:40px">Backup</h2><p class="small mute" style="max-width:62ch">Everything lives in this browser. Back up to a file to keep a copy or move to another device, then restore it there.</p><div class="actions"><button class="btn" data-act="backup">Back up to a file</button><label class="btn" for="restore" style="display:inline-flex;align-items:center">Restore from a file</label><input type="file" id="restore" accept="application/json,.json" hidden></div>
  <div class="actions" style="margin-top:32px"><button class="btn" data-act="reset">Erase everything and start over</button></div>`}
function render(){renderNav();const app=document.getElementById('app');if(!ready)return;
  if(!S.profile){if(!draft)draft=defProfile();app.innerHTML=profileForm(true);return}
  if(view==='profile'&&!draft)draft=JSON.parse(JSON.stringify(migrate(S.profile)));
  app.innerHTML=(view==='library'?library():view==='week'?week():view==='profile'?profileView():today())+(confirmReset?`<div class="modal"><div class="card"><h2>Erase everything?</h2><p>This removes your profile, every topic, your library and your weekly lists. It can't be undone.</p><div class="actions"><button class="btn ink" data-act="reset-yes">Erase</button><button class="btn" data-act="reset-no">Cancel</button></div></div></div>`:'')}

/* ---------- events ---------- */
function readForm(){const g=id=>document.getElementById(id);if(g('apikey')){const k=g('apikey').value.trim();if(k!==KEY){setKey(k);setModel('');failed.clear();cands=[]}}if(g('goal'))draft.goal=g('goal').value.trim();if(g('role'))draft.role=g('role').value.trim();if(g('resume'))draft.resume=g('resume').value.trim();
  [0,1,2].forEach(i=>{const el=g('t'+i);if(el&&/^\d\d:\d\d$/.test(el.value))draft.times[i]=el.value});if(g('hs')){const a=Math.max(0,Math.min(23,parseInt(g('hs').value,10)||0));const b=Math.max(a+1,Math.min(24,parseInt(g('he').value,10)||24));draft.hStart=a;draft.hEnd=b}
  document.querySelectorAll('[data-fmt]').forEach(c=>draft.formats[c.dataset.fmt]=c.checked)}
function setView(v){view=v;err='';if(v==='profile')draft=JSON.parse(JSON.stringify(S.profile));else draft=null;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();window.scrollTo(0,0)}
document.addEventListener('click',async e=>{const t=e.target.closest('button,a');if(!t)return;
  if(t.dataset.view){setView(t.dataset.view);return}
  if(t.dataset.seg){readForm();const n=t.dataset.seg,v=t.dataset.val,pid=t.dataset.pid;if(pid)draft.pillars[pid][n]=v;else draft[n]=n==='perDay'?(v==='hourly'?'hourly':Number(v)):v;render();return}
  if(t.dataset.res!=null){S.m.res=(S.m.res||0)+1;save();return}
  if(t.dataset.open){cur=t.dataset.open;view='today';render();window.scrollTo(0,0);return}
  const d=S.drops.find(x=>x.id===cur)||S.drops.filter(x=>!x.sample).slice(-1)[0];
  if(t.dataset.deeper){if(t.dataset.deeper==='sample')return;const pid=t.dataset.deeper;run('Going deeper',()=>generate({parent:pid}));return}
  if(t.hasAttribute('data-save')&&d){d.saved=!d.saved;render();save();return}
  if(t.dataset.fb&&d){d.fb=d.fb===t.dataset.fb?null:t.dataset.fb;render();save();return}
  const a=t.dataset.act;
  if(a==='due')run(leftover()?'Opening your next drop':'Fetching your next topics',releaseDue);
  if(a==='surprise')run(leftover()?'Opening your next drop':'Fetching your next topics',extraTopic);
  if(a==='weekly')run('Building your list',weekly);
  if(a==='reset'){confirmReset=true;render()}
  if(a==='backup'){const blob=new Blob([JSON.stringify({breadth:1,saved:Date.now(),state:S},null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='breadth-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);info='Backup downloaded.';render()}
  if(a==='reset-no'){confirmReset=false;render()}
  if(a==='reset-yes'){confirmReset=false;S={v:1,profile:null,drops:[],weekly:{},stock:[],skipped:{},m:{res:0}};cur=null;draft=null;view='today';save();render()}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='pf')return;e.preventDefault();readForm();const isNew=!S.profile;S.profile=migrate(JSON.parse(JSON.stringify(draft)));info='';await save();
  if(isNew){draft=null;view='today';render();if(hasAI())run('Fetching your first topics',async()=>{if(dueCount()>0)await releaseDue();else await extraTopic()});else render()}else{info='Saved. New drops will follow these settings.';render()}});
document.addEventListener('change',async e=>{if(e.target.id!=='restore'||!e.target.files[0])return;try{const j=JSON.parse(await e.target.files[0].text());if(!j||!j.state||!Array.isArray(j.state.drops))throw 0;S=Object.assign({v:1,profile:null,drops:[],weekly:{},stock:[],skipped:{},m:{res:0}},j.state);if(!Array.isArray(S.stock))S.stock=[];if(S.profile)S.profile=migrate(S.profile);save();cur=null;draft=S.profile?JSON.parse(JSON.stringify(S.profile)):null;info='Restored '+S.drops.length+' topics from your backup.'}catch(_){err='That file is not a Breadth backup.'}render()});
document.addEventListener('input',e=>{if(e.target.id==='libq'){libQ=e.target.value;const pos=e.target.selectionStart;render();const i=document.getElementById('libq');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(_){}}}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(NAV.some(n=>n[0]===h)&&h!==view)setView(h)});
const h0=location.hash.slice(1);if(NAV.some(n=>n[0]===h0))view=h0;

(async()=>{await load();render();if(S.profile&&view==='today')deliverDue();
  setInterval(()=>{if(S.profile&&!busy&&document.visibilityState==='visible'&&view==='today'){render()}},60000)})();
}
</script>
</body>
</html>
